services:
  copilot-api:
    image: ghcr.io/thinker-joe/copilot-api:latest
    container_name: copilot-api
    restart: unless-stopped
    ports:
      - "${COPILOT_API_BIND:-127.0.0.1}:${COPILOT_API_PORT:-4141}:4141"
    environment:
      PORT: 4141
      COPILOT_API_HOME: /data
      GH_TOKEN: ${GH_TOKEN:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-127.0.0.1,localhost}
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:4141/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
