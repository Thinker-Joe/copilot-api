name: Docker

on:
  push:
    branches: [dev, main]
    tags: ["v*"]
    paths:
      - "src/**"
      - "pages/**"
      - "tests/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - "tsdown.config.ts"
      - "Dockerfile"
      - "entrypoint.sh"
      - "healthcheck.sh"
      - "docker-compose*.yaml"
      - ".env*.example"
      - ".dockerignore"
      - ".gitattributes"
      - ".github/workflows/release-docker.yml"
  pull_request:
    paths:
      - "src/**"
      - "pages/**"
      - "tests/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - "tsdown.config.ts"
      - "Dockerfile"
      - "entrypoint.sh"
      - "healthcheck.sh"
      - "docker-compose*.yaml"
      - ".env*.example"
      - ".dockerignore"
      - ".gitattributes"
      - ".github/workflows/release-docker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: desktop
      - name: Lint container-related TypeScript
        run: bun run lint src/lib/config-store.ts src/lib/server-health.ts src/start.ts tests/config-corrupt.test.ts tests/config-store-io.test.ts tests/docker-entrypoint.test.ts tests/docker-healthcheck.test.ts tests/docker-smoke.test.ts tests/server-health.test.ts tests/server-startup-health.test.ts
      - run: bun run typecheck
      - run: bun test
      - name: Validate Compose variants
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yaml -f docker-compose.sv.yaml config --quiet
      - name: Build native image
        run: docker build --tag copilot-api:test .
      - name: Test container lifecycle
        run: bun test tests/docker-smoke.test.ts
        env:
          COPILOT_API_DOCKER_TEST_IMAGE: copilot-api:test

  publish:
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      LATEST_CHANNEL: ${{ vars.DOCKER_LATEST_CHANNEL || (github.event.repository.fork && 'dev' || 'release') }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare registry metadata
        shell: bash
        run: |
          case "$LATEST_CHANNEL" in
            dev|release) ;;
            *) echo 'DOCKER_LATEST_CHANNEL must be dev or release' >&2; exit 1 ;;
          esac
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=${{ env.LATEST_CHANNEL == 'release' && 'auto' || 'false' }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable=${{ env.LATEST_CHANNEL == 'dev' && github.ref == 'refs/heads/dev' }}
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=long,prefix=sha-
      - name: Publish verified image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
